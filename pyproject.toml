[project]
name = "wom"
version = "0.1.0"
description = "Mini World Models: V · M · C on a Racing Track"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "pygame>=2.5.0",
    "torch>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

